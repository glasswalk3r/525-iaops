groups:
- name: nodes
  rules:
  - alert: NodeDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Instância não responde (instance {{ $labels.instance }})"
      description: "A instância {{ $labels.instance }} (job {{ $labels.job }}) está offline há mais de 1 minuto."
