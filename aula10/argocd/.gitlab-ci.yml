stages:
  - secrets
  - build
  - push
  - update_manifests

variables:
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

  # GAR
  GAR_HOST: "us-central1-docker.pkg.dev"
  GCP_PROJECT_ID: "ID_PROJECT"
  REGISTRY_REPO: "productcatalogservice"
  IMAGE_NAME: "productcatalogservice"

  IMAGE_URI: "${GAR_HOST}/${GCP_PROJECT_ID}/${REGISTRY_REPO}/${IMAGE_NAME}:${IMAGE_TAG}"

  # GitOps repo alvo
  GITOPS_REPO_PATH: "analista/loja-online"
  GITOPS_BRANCH: "main"

  # Manifest alvo no repo loja-online
  # Se você mover o arquivo para uma pasta, ajuste aqui:
  # Ex.: "projeto/productcatalogservice.yaml"
  MANIFEST_FILE: "productcatalogservice.yaml"

  GITOPS_COMMIT_USER: "gitops-bot"
  GITOPS_COMMIT_EMAIL: "gitops-bot@4labs.example"

  GIT_DEPTH: "20"

# ----------------------------
# SECRETS (Vault -> dotenv)
# ----------------------------
fetch_vault_secrets:
  stage: secrets
  tags:
    - docker
    - produtos
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      set -e

      echo "Job fetch_vault_secrets: iniciando..."

      if [ "$VAULT_SKIP_VERIFY" = "true" ]; then
        CURL_TLS="-k"
      else
        CURL_TLS=""
      fi

      echo ">> Login no Vault via AppRole..."
      LOGIN_PAYLOAD=$(printf '{"role_id":"%s","secret_id":"%s"}' \
        "$VAULT_ROLE_ID" "$VAULT_SECRET_ID")

      LOGIN_RESPONSE=$(curl -sS $CURL_TLS -X POST \
        "$VAULT_ADDR/v1/auth/approle/login" \
        -H "Content-Type: application/json" \
        -d "$LOGIN_PAYLOAD")

      VAULT_TOKEN=$(echo "$LOGIN_RESPONSE" | python3 -c \
        'import sys, json; print(json.load(sys.stdin).get("auth", {}).get("client_token", ""))')

      if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
        echo "Erro: login no Vault falhou (client_token vazio)."
        exit 1
      fi

      echo ">> Lendo segredos de productcatalogservice..."
      SECRETS_RESPONSE=$(curl -sS $CURL_TLS \
        -H "X-Vault-Token: $VAULT_TOKEN" \
        "$VAULT_ADDR/v1/secret/data/produtos/productcatalogservice")

      CATALOG_API_KEY=$(echo "$SECRETS_RESPONSE" | python3 -c \
        'import sys, json; d=json.load(sys.stdin); print(d.get("data", {}).get("data", {}).get("CATALOG_API_KEY", ""))')

      SENTRY_DSN=$(echo "$SECRETS_RESPONSE" | python3 -c \
        'import sys, json; d=json.load(sys.stdin); print(d.get("data", {}).get("data", {}).get("SENTRY_DSN", ""))')

      if [ -z "$CATALOG_API_KEY" ] || [ "$CATALOG_API_KEY" = "null" ]; then
        echo "Erro: CATALOG_API_KEY não encontrado no Vault."
        exit 1
      fi

      if [ -z "$SENTRY_DSN" ] || [ "$SENTRY_DSN" = "null" ]; then
        echo "Erro: SENTRY_DSN não encontrado no Vault."
        exit 1
      fi

      echo "Gerando vault.env..."
      printf "CATALOG_API_KEY=%s\n" "$CATALOG_API_KEY" > vault.env
      printf "SENTRY_DSN=%s\n" "$SENTRY_DSN" >> vault.env

  artifacts:
    reports:
      dotenv: vault.env
    expire_in: 30m

# ----------------------------
# AUTH GCP (para GAR)
# ----------------------------
before_script:
  - |
    set -e

    if [ -n "$GCP_SA_KEY" ] && [ -f "$GCP_SA_KEY" ]; then
      echo "Usando GCP_SA_KEY como arquivo."
      KEY_FILE="$GCP_SA_KEY"
    else
      printf '%s' "$GCP_SA_KEY" > "${CI_PROJECT_DIR}/gcp-key.json"
      KEY_FILE="${CI_PROJECT_DIR}/gcp-key.json"
    fi
  - gcloud auth activate-service-account --key-file="${KEY_FILE}"
  - gcloud --quiet config set project "${GCP_PROJECT_ID}"
  - gcloud --quiet auth configure-docker "${GAR_HOST}"

# ----------------------------
# BUILD
# ----------------------------
build:
  stage: build
  tags:
    - docker
    - produtos
  needs:
    - fetch_vault_secrets
  script:
    - |
      set -e
      echo "Build da imagem: ${IMAGE_URI}"
      docker build --network=host -t "${IMAGE_URI}" .
  artifacts:
    when: always
    expire_in: 1h
    paths:
      - gcp-key.json

# ----------------------------
# PUSH
# ----------------------------
push:
  stage: push
  tags:
    - docker
    - produtos
  needs:
    - build
  script:
    - |
      set -e
      echo "Push da imagem: ${IMAGE_URI}"
      docker push "${IMAGE_URI}"

# ----------------------------
# GITOPS: Atualiza manifest no repo loja-online
# ----------------------------
update_manifests:
  stage: update_manifests
  tags:
    - docker
    - produtos
  needs:
    - push
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    GIT_STRATEGY: "none"
  script:
    - |
      set -e

      echo "Atualizando manifest GitOps no repo ${GITOPS_REPO_PATH}"
      echo "Nova imagem: ${IMAGE_URI}"

      if [ -z "$GITOPS_PUSH_TOKEN" ]; then
        echo "Erro: GITOPS_PUSH_TOKEN não definido."
        exit 1
      fi

      git config --global user.name "${GITOPS_COMMIT_USER}"
      git config --global user.email "${GITOPS_COMMIT_EMAIL}"

      git clone "http://oauth2:${GITOPS_PUSH_TOKEN}@${CI_SERVER_HOST}/${GITOPS_REPO_PATH}.git" gitops
      cd gitops
      git checkout "${GITOPS_BRANCH}"

      if [ ! -f "${MANIFEST_FILE}" ]; then
        echo "Erro: ${MANIFEST_FILE} não encontrado no repo ${GITOPS_REPO_PATH}"
        exit 1
      fi

      sed -i -E \
        "s|(image:[[:space:]]*${GAR_HOST}/${GCP_PROJECT_ID}/${REGISTRY_REPO}/${IMAGE_NAME}:).*|\1${IMAGE_TAG}|" \
        "${MANIFEST_FILE}"

      echo "Diff do manifest:"
      git diff "${MANIFEST_FILE}" || true

      if git diff --quiet -- "${MANIFEST_FILE}"; then
        echo "Nenhuma mudança detectada no manifest. Encerrando."
        exit 0
      fi

      git add "${MANIFEST_FILE}"
      git commit -m "GitOps: productcatalogservice -> ${IMAGE_TAG} [skip ci]"
      git push origin "${GITOPS_BRANCH}"
