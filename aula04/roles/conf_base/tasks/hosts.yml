---
- name: Ler o arquivo /etc/hosts
  ansible.builtin.command:
    cmd: cat /etc/hosts
  register: content
  changed_when: false
  tags: hosts

- name: Limpa o arquivo /etc/hosts
  ansible.builtin.shell: echo '' > /etc/hosts
  when: "'10.10.0.10 devops-management.4labs devops-management' not in content.stdout"
  changed_when: false
  tags: hosts

- name: Configuracao do arquivo /etc/hosts
  when: "'10.10.0.10 devops-management.4labs devops-management' not in content.stdout"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.fqdn }} {{ item.alias }}"
  with_items:
    - {ip: '127.0.0.1', fqdn: 'localhost.localdomain', alias: 'localhost'}
    - {ip: '10.10.0.10', fqdn: 'devops-management.4labs', alias: 'devops-management'}
    - {ip: '10.10.0.11', fqdn: 'devops-automation.4labs', alias: 'devops-automation'}
    - {ip: '10.10.0.12', fqdn: 'devops-monitoring.4labs', alias: 'devops-monitoring'}
    - {ip: '10.10.0.13', fqdn: 'devops-logging.4labs', alias: 'devops-logging'}      
  tags: hosts
